version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ofertas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ofertas
      POSTGRES_PASSWORD: ofertas
      POSTGRES_DB: plataforma_ofertas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofertas -d plataforma_ofertas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ofertas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # As imagens de api/workers/admin-panel serão adicionadas a partir da Fase 1,
  # quando houver código de aplicação para buildar (ver infra/Dockerfile.*).

volumes:
  postgres_data:
  redis_data:
